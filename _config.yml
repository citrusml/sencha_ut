title: 東京大学薫風流煎茶同好会
description: 東京大学薫風流煎茶同好会の公式サイトです。東大を中心とした煎茶道のインカレサークルで、玉露や四季折々のお茶を楽しみながら、和気あいあいとお稽古に励んでいます。煎茶道・薫風流の紹介、入会案内、活動記録を掲載しています。
url: "https://sencha-ut.com"
baseurl: ""
lang: ja
# 日時を日本時間で扱う。指定しないと公開時のビルドが UTC になり、当日の朝 9 時より前に公開した記事が「未来の記事」として出ない
